name = "myshadchan-share"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# Story 9.5 (storage ruling): NO R2 binding. R2 is not enabled on this
# Cloudflare account (10042 "Please enable R2 through the Cloudflare
# Dashboard"), and no code path in the product ever uploads a resume/photo
# byte to R2 — every upload writes to Supabase Storage's `documents` bucket.
# This Worker reaches Storage through the ordinary @supabase/supabase-js
# client it already gets SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY for (below),
# the same way every other Worker does. See ARCHITECTURE-SPINE.md AD-9/AD-15
# (amended by this story) and the story's own Dev Notes "Why Supabase
# Storage, not R2".

# Secrets (set via `wrangler secret put <NAME> --config workers/share/wrangler.toml`,
# or the CI job in .github/workflows/deploy.yml): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

# Story 15.4: Rate limiting enforcement marker (workers/shared/rateLimit.ts).
# Declared as a [vars] entry so it ships with every deploy automatically — no
# separate secret-push step can be dropped. See workers/shared/rateLimit.ts
# header comment for the fail-closed / fail-open decision table this drives.
[vars]
RATE_LIMITING_ENFORCED = "true"

# Story 15.4: three Cloudflare native rate-limit bindings for share-link access —
# IP-scoped pre-auth backstop + per-account post-auth backstop + per-token bucket.
# All are fail-closed (PRV-8 paid path). namespace_id is an arbitrary string
# unique per binding within the Cloudflare account.
[[ratelimits]]
name = "SHARE_IP_RATE_LIMITER"
namespace_id = "1401"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SHARE_ACCOUNT_RATE_LIMITER"
namespace_id = "1402"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SHARE_TOKEN_RATE_LIMITER"
namespace_id = "1403"
simple = { limit = 30, period = 60 }
