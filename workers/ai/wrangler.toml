name = "myshadchan-ai"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8789

# Secrets (set via `wrangler secret put <NAME> --config workers/ai/wrangler.toml`,
# or the CI job in .github/workflows/deploy.yml): SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PUBLISHABLE_KEY.
