# Review fix (Finding 12): this worker no longer calls Claude (see
# dossierNarrator.ts's header comment), so AI_GATEWAY_ACCOUNT_ID,
# AI_GATEWAY_ID and ANTHROPIC_API_KEY are no longer required here — nothing
# in workers/ai/** reads them. Not removed from wherever they were
# provisioned (e.g. Cloudflare's dashboard) as part of this change; that is
# an infra action, not a code one, and out of scope for this fix.
