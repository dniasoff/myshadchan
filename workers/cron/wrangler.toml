name = "myshadchan-cron"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# [triggers] was withheld from worker-audit (2026-08-02) through R2 (Epic 11
# external review, Finding 11 closure) because the ORIGINAL reason still
# applies to a DIFFERENT, still-unbuilt sweep: Story 12-2-reminder-delivery.md
# (Task 4/5: workers/shared/resend.ts, workers/cron/sweepReminders.ts) owns a
# due/overdue-task sweep (AD-13) and its AC-4 backfill migration has not
# landed — enabling a trigger that fired sweepReminders() today would sweep
# the 8 already-overdue tasks with no suppression in place. That mechanism is
# still not wired into scheduled() (confirmed by reading workers/cron/index.ts
# as part of R2 — it remains a bare stub for reminders/message-notification
# work), so the trigger below activates ONLY the sweep R2 added:
# sweepAiParseAttempts() (./sweepAiParseAttempts.ts), an account-agnostic
# PII-retention TTL over `ai_parse_attempts` — not reminders, not delivery.
# Story 7.5's message-notification sweep (sweepMessages.ts) is equally
# unwired for the same reason as before (workers/shared/resend.ts is
# outstanding) and is likewise NOT activated by this trigger.
#
# Retention is daily-ish maintenance, not minutely, hence the schedule below
# (03:00 UTC daily) rather than the old provisional */15 cadence, which was
# sized for a due/overdue sweep that still does not run here.
#
# When 12.2's AC-4 backfill lands and sweepReminders() is wired into this
# same scheduled() tick, confirm it does not change the cadence this comment
# documents without updating the comment to match.
[triggers]
crons = ["0 3 * * *"]

# Secrets (set via `wrangler secret put <NAME> --config workers/cron/wrangler.toml`,
# or the CI job in .github/workflows/deploy.yml): SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY (email delivery floor),
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY (Story 7.5, web push — only the
# public key also reaches the client, as VITE_VAPID_PUBLIC_KEY).
