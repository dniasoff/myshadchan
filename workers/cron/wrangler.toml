name = "myshadchan-cron"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# Story 12.2: TWO cron schedules on this ONE Worker, both dispatched to the
# same scheduled() export — Cloudflare fans every entry in this array out to
# the same handler, distinguished at runtime by `event.cron`
# (index.ts's own REMINDER_SWEEP_CRON constant is what that branch matches
# against; keep the two in sync if either ever changes).
#
#   - "*/15 * * * *" — Story 12.2's reminder-delivery sweep (AD-13):
#     sweepReminders.ts, claiming due/overdue tasks and emailing their
#     owner. 15 minutes is this story's own delivery-window decision, and
#     30 minutes (2x) is the staleness threshold AC-9's Settings row renders
#     ("Sending" vs "Paused"). This was withheld from worker-audit
#     (2026-08-02) through R2 (Epic 11 external review, Finding 11 closure)
#     because the reminders sweep's own AC-4 backfill migration — which
#     suppresses the pre-existing overdue backlog so the first tick after
#     enabling this schedule does not email every historical overdue
#     reminder at once — had not shipped yet. It has now (this story's own
#     migration), so this schedule is safe to arm.
#   - "0 3 * * *" — R2's daily PII-retention sweep, sweepAiParseAttempts()
#     (./sweepAiParseAttempts.ts), account-agnostic, unrelated to reminders.
#     Unchanged by this story.
#
# Story 7.5 tightens the retention schedule to */1 for message notifications
# if it lands; reminders would then simply sweep more often too — harmless,
# and the 30-minute staleness threshold above still holds regardless.
[triggers]
# RE-ARMED 2026-08-07 (Epic 12 adversarial review fixes, R1 and R2 — see
# _bmad-output/epic-12-adversarial-review-report-2026-08-07.md). This schedule
# was paused because two defects were irreversible once a tick fired:
#
#   - R1: the recipient join checked only members.disabled, never that the
#     member still held an ACTIVE membership in the task's own account_id —
#     an archived household member (a removed spouse, Story 12.3's
#     deliberate history-preserving design) kept receiving that household's
#     reminder emails. Fixed: public.is_deliverable_member() (02_functions
#     .sql) is now the ONE shared predicate enqueue_due_task_notifications(),
#     validate_task_assignee() and context_members all use — proven with a
#     new db-suite case (an account_members row archived AFTER assignment,
#     member NOT globally disabled) that failed before the fix and passes
#     after it (supabase/tests/reminder_delivery.sql).
#   - R2: any transient Resend failure (429/5xx/transport) settled the row
#     `failed` permanently — no retry, no way to re-enqueue that due
#     occurrence, so a momentary Resend outage silently defeated delivery.
#     Fixed: workers/shared/resend.ts classifies retryable-vs-terminal
#     failures; a retryable one re-arms the row `pending` at a
#     backoff-scheduled `next_attempt_at` (capped at 5 attempts) instead of
#     failing immediately.
#
# Also closed in the same pass (not themselves reasons this was paused, but
# found and fixed alongside): R4, a settle failure for one claimed row used
# to abort the whole batch and strand every remaining row — now contained
# per-row, with a lease-timeout recovery path for a stranded 'sending' row
# and an at-least-once/Resend-idempotency-key delivery guarantee (see
# sweepReminders.ts's own header — this is no longer described as "exactly
# once" anywhere in this codebase); and R3, a green heartbeat no longer
# implies healthy delivery (cron_heartbeat.last_failed_count,
# ReminderDeliveryStatus.tsx's new "Delivery failing" state).
crons = ["*/15 * * * *", "0 3 * * *"]

# Secrets (set via `wrangler secret put <NAME> --config workers/cron/wrangler.toml`,
# or the CI job in .github/workflows/deploy.yml): SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY + RESEND_FROM (Story 12.2, email
# delivery floor), VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY (Story 7.5, web push
# — only the public key also reaches the client, as VITE_VAPID_PUBLIC_KEY).
#
# APP_ORIGIN (Story 12.2): plain, non-secret — the reminder email's link back
# into the app. The app runs on ra-core's default HashRouter
# (RemindersPage.path = "/reminders"), so sweepReminders.ts appends
# "/#/reminders" itself; this var is the origin only, no path.
[vars]
APP_ORIGIN = "https://www.myshadchan.space"
