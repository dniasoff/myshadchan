name = "myshadchan-ingest"
main = "index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME> --config workers/ingest/wrangler.toml`,
# or the CI job in .github/workflows/deploy.yml): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
#
# Cloudflare Email Routing itself is wired up in the dashboard (or `wrangler
# email` once available) to point an inbound address at this Worker — that
# binding isn't expressed in this file.

# Story 15.4: Rate limiting enforcement marker (workers/shared/rateLimit.ts).
# Declared as a [vars] entry so it ships with every deploy automatically — no
# separate secret-push step can be dropped. See workers/shared/rateLimit.ts
# header comment for the fail-closed / fail-open decision table this drives.
[vars]
RATE_LIMITING_ENFORCED = "true"

# Story 15.4 (Finding 16): two Cloudflare native rate-limit bindings for
# channel ingestion — IP-scoped pre-auth backstop + per-account post-auth
# backstop. Both are fail-open (ingestion is not a paid path). namespace_id is
# an arbitrary string unique per binding within the Cloudflare account.
[[ratelimits]]
name = "INGEST_IP_RATE_LIMITER"
namespace_id = "1301"
simple = { limit = 50, period = 60 }

[[ratelimits]]
name = "INGEST_ACCOUNT_RATE_LIMITER"
namespace_id = "1302"
simple = { limit = 100, period = 60 }
