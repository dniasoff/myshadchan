name: 🚀 Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-supabase:
    name: 🚀 Deploy (supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      IS_SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_ACCESS_TOKEN && secrets.SUPABASE_DB_PASSWORD && secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      ADMIN_RESEED_SECRET: ${{ secrets.ADMIN_RESEED_SECRET }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⚙️ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: ⚙️ Setup supabase
        uses: supabase/setup-cli@v3
        with:
          # 2.112.0 rejects the hosted Management API's current inserted_at
          # timestamp shape during `supabase link`; 2.111.0 is the last
          # known-good deploy version until that upstream regression lands.
          version: 2.111.0

      - name: 📥 Download deps
        run: npm ci

      # The `version:` pin on setup-cli above is only real if these steps call
      # the binary it installed. They used to call `npx supabase`, which
      # ignores PATH and installs supabase@latest from npm — on 2026-08-23
      # that silently ran 2.115.0 against the pin's back, and `link` then
      # misread the remote migration history and reported ~90 already-applied
      # migrations as pending. `db push` duly re-applied the first one and
      # died on `column "deleted_at" ... already exists`, failing the deploy
      # and skipping the frontend. Print the resolved version so a future
      # drift is visible in the log instead of inferred from a failure.
      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 🏷️ Report the pinned Supabase CLI version
        run: supabase --version

      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 🔗 Supabase Link
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      # The before_user_created Auth Hook is RETIRED. It ran check_signup_age()
      # to 403 a signup that had not affirmed 18+; the affirmation is now made
      # by the act of creating an account and stated as such in the UI
      # (`AgeNotice`), so the hook — and public.signup_intents, the only way
      # the Google OAuth path could ever carry an affirmation to it — are both
      # dropped by migration.
      #
      # This step therefore turns the hook OFF, and it runs BEFORE `db push`
      # rather than after. That order is load-bearing in both directions:
      # `db push` is what drops the function, and a hosted project still
      # calling a dropped function answers every signup with a GoTrue 500
      # ("Error running hook URI"). Disabling first means the PATCH failing
      # aborts the deploy before the drop, and the PATCH succeeding but a
      # later step failing leaves the hook off with the function still
      # present — which is the intended end state anyway.
      #
      # The step STAYS, permanently, rather than simply being deleted: every
      # earlier deploy PATCHed this setting ON, so the hosted project holds
      # `enabled = true` until something explicitly says otherwise. Deleting
      # the step would leave that stale `true` pointing at a dropped function
      # forever. supabase/config.toml is never synced (Story 2.7 review
      # finding #1), so this Management API PATCH is the only channel there is.
      #
      # Deliberately a SCOPED Management API patch, not `supabase config
      # push`: config.toml's `[auth]` block also carries this repo's local
      # dev values (`site_url = "http://localhost:5173"`,
      # `additional_redirect_urls = ["https://localhost:5173/..."]`) —
      # `config push` sends the whole auth config and would overwrite the
      # hosted project's real production site_url/redirect allow-list with
      # those localhost values on every deploy. This PATCHes only the hook
      # field, leaving everything else the dashboard already has untouched.
      #
      # Story 6.6: the retry-with-backoff on a transient failure, and the
      # redaction that keeps a successful PATCH's response (242 keys,
      # including an unmasked `smtp_pass` and `external_google_secret`) out
      # of the run log, both now live in the shared
      # scripts/ci/patch-supabase-auth-config.sh — see its header for the
      # full behaviour. It is the same script the mailer step below calls,
      # so the retry logic exists once, not as two inline copies.
      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 📡 Retire the signup age-gate Auth Hook (before_user_created)
        run: |
          jq -n '{ hook_before_user_created_enabled: false }' \
              > /tmp/hook-payload.json

          scripts/ci/patch-supabase-auth-config.sh /tmp/hook-payload.json \
              "before_user_created Auth Hook disable PATCH rejected"

      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 📡 Push supabase migrations
        run: supabase db push

      # `[auth.email.template.*]` in supabase/config.toml is a LOCAL-ONLY
      # block — `supabase db push` ships migrations, not auth config, so
      # nothing ever transmitted it. Production served GoTrue's stock
      # magic-link template, which renders `{{ .ConfirmationURL }}` and no
      # `{{ .Token }}`, while Epic 2's login UI asks the user to type a
      # 6-digit code: the product's only authentication path was dead until
      # it was PATCHed by hand. Same scoped-PATCH rationale as the hook step
      # above — never `supabase config push`, which would overwrite the
      # hosted site_url / redirect allow-list with this file's localhost dev
      # values.
      #
      # Subject and body are read back out of config.toml and
      # supabase/templates/ so the repo stays the single source of truth and
      # this step cannot drift from what a reviewer reads. Only `magic_link`
      # is sent, because it is the only template the repo declares — adding
      # invite / recovery / email-change keys here would mean inventing
      # bodies in CI that nobody reviewed, the same drift in reverse.
      #
      # The three numeric mailer settings have no home in config.toml (the
      # CLI does not model OTP length, OTP expiry or the email rate limit),
      # so they are pinned here and mirror what production runs today. The
      # consequence is deliberate: an emergency manual bump to
      # `rate_limit_email_sent` is reverted by the next deploy — change the
      # number here instead. `mailer_otp_length: 6` is what the login copy
      # and e2e/fixtures.ts (`/\b(\d{6})\b/`) both assume; production ran 8
      # for the whole of Epic 2.
      #
      # Story 6.6: transient failures (a 5xx, a 429, or a curl transport
      # error) are now retried three times, with backoff, by the shared
      # scripts/ci/patch-supabase-auth-config.sh — see its header for the
      # full behaviour. A 400 still fails the deploy immediately, with no
      # retry: template writes used to 400 ("not available for free tier
      # projects using the default email provider"); now that custom SMTP
      # is configured on the project, a 400 means SMTP was REMOVED — an
      # alarm to stop on, not a warning to pass, and retrying it would
      # delay that alarm behind two backoffs and print it three times.
      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 📡 Push auth mailer config (config.toml + templates → hosted)
        run: |
          set -euo pipefail

          section='/^\[auth\.email\.template\.magic_link\]/ { inside = 1; next } /^\[/ { inside = 0 }'
          read_key() {
              awk "$section"' inside && $0 ~ "^"key"[[:space:]]*=" { sub(/^[^=]*=[[:space:]]*/, ""); gsub(/^"|"$/, ""); print; exit }' \
                  key="$1" supabase/config.toml
          }

          subject=$(read_key subject)
          content_path=$(read_key content_path)

          test -n "$subject" || { echo "::error::no magic_link subject in supabase/config.toml"; exit 1; }
          test -f "$content_path" || { echo "::error::magic_link template not found: '$content_path'"; exit 1; }

          jq -n --arg subject "$subject" --rawfile body "$content_path" \
              '{
                  mailer_subjects_magic_link: $subject,
                  mailer_templates_magic_link_content: $body,
                  mailer_otp_length: 6,
                  mailer_otp_exp: 600,
                  rate_limit_email_sent: 20
              }' > /tmp/mailer-payload.json

          scripts/ci/patch-supabase-auth-config.sh /tmp/mailer-payload.json \
              "auth mailer PATCH rejected — if this is a 400, custom SMTP was removed from the project"

          echo "✅ Auth mailer config pushed (magic_link template + OTP length/expiry + email rate limit)." >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ env.IS_SUPABASE_CONFIGURED && env.RESEND_API_KEY }}
        name: 📡 Push supabase function secrets
        run: |
          supabase secrets set RESEND_API_KEY=${{ env.RESEND_API_KEY }}
          supabase secrets set UPSTASH_REDIS_REST_URL=${{ env.UPSTASH_REDIS_REST_URL }}
          supabase secrets set UPSTASH_REDIS_REST_TOKEN=${{ env.UPSTASH_REDIS_REST_TOKEN }}

      # Bulk demo-account reseed function. The secret is operator-chosen,
      # so route it through a temp file rather than interpolating it into
      # the shell command (see the `printf`/`mktemp` steps below for the
      # same posture applied to Cloudflare Worker secrets).
      - if: ${{ env.IS_SUPABASE_CONFIGURED && env.ADMIN_RESEED_SECRET }}
        name: 📡 Push admin reseed secret
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'ADMIN_RESEED_SECRET=%s\n' "$ADMIN_RESEED_SECRET" > "$secrets_file"
          supabase secrets set --env-file "$secrets_file"
          echo "✅ ADMIN_RESEED_SECRET pushed — the admin_reseed_demo_accounts function is protected." >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ env.IS_SUPABASE_CONFIGURED && !env.ADMIN_RESEED_SECRET }}
        name: Admin reseed secret NOT pushed
        run: |
          echo '::warning::ADMIN_RESEED_SECRET repo secret is missing.'
          echo ':rotating_light: **ADMIN_RESEED_SECRET not pushed.** The deployed `admin_reseed_demo_accounts` function will return `401` on every request until the secret is set.' >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 📡 Deploy supabase functions
        run: supabase functions deploy

      # `supabase functions deploy` only ever pushes. Delete a function's
      # directory from the repo and it keeps serving in production forever,
      # with nothing anywhere to notice. `update_password` — a live
      # supabaseAdmin-backed password-reset endpoint in a product that has no
      # passwords — plus the Epic 1 fossils `merge_contacts` and
      # `delete_note_attachments` all survived exactly this way, and all
      # three were reachable by anyone (`verify_jwt: false` at the gateway).
      # They were removed by hand; this step is what stops the next one.
      #
      # Deleting automatically is safe *because of where this sits*: it runs
      # only after `functions deploy` SUCCEEDED, so every locally-declared
      # function is already live, and therefore `live − local` can never
      # contain one of ours. The single way that reasoning breaks is an empty
      # local set (a bad checkout, a moved directory) — which would make
      # every live function look orphaned — so that case aborts instead.
      - if: ${{ env.IS_SUPABASE_CONFIGURED }}
        name: 🧹 Remove edge functions deleted from the repo
        run: |
          set -euo pipefail

          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions"

          # Deliberately the CLI's own rule — every directory under
          # supabase/functions/ that is not `_`-prefixed (`_shared` is a
          # library, not a function) — and NOT something narrower like
          # "has an index.ts". Narrower is the unsafe direction here: a
          # function this predicate fails to recognise looks orphaned and
          # gets deleted. Erring wide only ever leaves something alive.
          local_fns=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -v '^_' | sort)

          if [ -z "$local_fns" ]; then
              echo "::error::no edge functions found under supabase/functions/ — refusing to reconcile"
              exit 1
          fi

          curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" \
              -o /tmp/live-functions.json \
              || { echo "::error::could not list deployed edge functions"; head -c 2000 /tmp/live-functions.json >&2; exit 1; }

          orphans=$(comm -23 <(jq -r '.[].slug' /tmp/live-functions.json | sort) <(echo "$local_fns"))

          if [ -z "$orphans" ]; then
              echo "✅ Edge functions in sync — nothing deployed that the repo no longer declares." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          for slug in $orphans; do
              curl -sS --fail-with-body -X DELETE \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/$slug" \
                  -o /tmp/delete-function.json \
                  || { echo "::error::could not delete orphaned edge function '$slug'"; head -c 2000 /tmp/delete-function.json >&2; exit 1; }
              echo "🧹 Deleted orphaned edge function \`$slug\` — no longer declared in \`supabase/functions/\`." >> "$GITHUB_STEP_SUMMARY"
          done

      - if: ${{ !env.IS_SUPABASE_CONFIGURED }}
        name: Supabase deployment skipped
        run: |
          echo ':warning: Supabase deployment skipped — missing SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID secret' >> $GITHUB_STEP_SUMMARY

  deploy-workers:
    name: 🚀 Deploy (Cloudflare Workers · ${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The workers are a THIRD pipeline off the same push, and until this
    # `needs:` they ran concurrently with `db push` exactly as Vercel did: a
    # failed migration still shipped all seven workers, `billing` and `ai`
    # included. Gating them on deploy-supabase means backend code never goes
    # live against a schema that failed to apply.
    needs: deploy-supabase

    # `billing` WAS withheld from this matrix (worker-audit, 2026-08-02):
    #   - billing: publishes an unauthenticated POST /webhook on a public
    #     workers.dev origin ahead of Story 12.4 (Stripe integration).
    #     There is no Stripe SDK, no signature verification, and no DB
    #     write yet — a real Stripe webhook would retry against a 501 for
    #     days and then disable the endpoint.
    #   Story 12.4 lands the real handler (signature verification via the
    #   Stripe SDK, the stripe_events idempotency ledger, the subscription
    #   sync) and provisions STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET /
    #   STRIPE_PRICE_ID_QUARTERLY / STRIPE_PRICE_ID_YEARLY / APP_ORIGIN, so
    #   `billing` rejoins the matrix below — the endpoint Stripe's test-mode
    #   webhook is registered against (workers/billing/wrangler.toml's
    #   `workers_dev = true`) now has somewhere real to arrive.
    #
    # `share` was ALSO withheld here (worker-audit, 2026-08-02: it was the
    # only worker with an R2 binding, and R2 is not enabled on this
    # Cloudflare account — error 10042 "Please enable R2 through the
    # Cloudflare Dashboard", confirmed live against the API). That
    # withholding note itself already named its own unlock: "Re-add once
    # R2 is enabled on the account ... (or the binding is dropped)."
    # Story 9.5 took the second branch — its storage ruling drops the
    # `[[r2_buckets]]` binding from workers/share/wrangler.toml entirely
    # and rewrites the Worker to stream from Supabase Storage's
    # `documents` bucket instead (ARCHITECTURE-SPINE.md AD-9, amended in
    # the same diff). `share` now needs nothing beyond the base
    # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY secrets every other worker
    # in this matrix already gets, so it rejoins the matrix below rather
    # than staying withheld for a binding that no longer exists.
    #
    # `fail-fast: false` (run 30742647288, 2026-08-02): CLOUDFLARE_API_TOKEN
    # was added as a repo secret but the token itself was rejected —
    # `wrangler deploy` failed every leg identically with "Authentication
    # error [code: 10000]" / "Invalid access token [code: 9109]" from the
    # Cloudflare API, not a per-worker problem. With the default fail-fast,
    # the first leg to fail ("match") cancelled the other four before they
    # even ran, so the run showed one real error and four ambiguous
    # "canceled" annotations — worse for diagnosing an account-wide auth
    # problem, since a reader can't tell "canceled" apart from "would have
    # succeeded". Disabling fail-fast lets all five legs attempt and report
    # their own copy of the real wrangler error, and — combined with the
    # `trigger-frontend` change below — a Cloudflare auth failure no longer
    # cancels work that doesn't depend on it.
    strategy:
      fail-fast: false
      matrix:
        worker: [ingest, parse, match, ai, cron, share, billing]

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN && secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E11 finding 15: `ai` and `parse` are the only two workers whose own
      # wrangler.toml declares this (see workers/ai/wrangler.toml,
      # workers/parse/wrangler.toml) — `aiEntitlementGate.ts`'s
      # `requireAiEntitlement` calls `createClient(SUPABASE_URL,
      # SUPABASE_PUBLISHABLE_KEY, ...)` on every non-health route of both, so
      # without it the Worker throws an unhandled 500 instead of the intended
      # 401/402. Not part of the "base secrets" step below because the other
      # four workers in this matrix (ingest, match, cron, share) never read it.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Story 12.2: the `cron` Worker's outbound-email sender identity —
      # `RESEND_FROM` (a verified Resend sending domain address, e.g.
      # support@myshadchan.space). Only `cron` reads it (see the push step
      # below); declared at the job level like every other secret here.
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      # Story 12.4: the remaining three billing-worker bindings. There is no
      # monthly cadence (pricing amendment) — STRIPE_PRICE_ID_QUARTERLY, not
      # _MONTHLY. APP_ORIGIN here is `billing`'s own Checkout/Portal
      # return-URL origin — a DIFFERENT push mechanism than `cron`'s own
      # APP_ORIGIN (a plain `[vars]` literal in workers/cron/wrangler.toml,
      # never a secret); billing's copy is pushed as a Worker secret instead
      # (see workers/billing/wrangler.toml's own comment on why).
      STRIPE_PRICE_ID_QUARTERLY: ${{ secrets.STRIPE_PRICE_ID_QUARTERLY }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
      # E11 finding 15: `parse` only — `resumeExtractor.ts`'s `geminiExtractor()`
      # needs all three to call Gemini through the Cloudflare AI Gateway (AD-8).
      # `ai` no longer needs these (Review fix Finding 12 deleted the Claude
      # narrator — see workers/ai/wrangler.toml's header comment) and
      # ANTHROPIC_API_KEY is moot for the same reason, so neither is wired here.
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: ⚙️ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      # External review Finding 1 (2026-08-06), widened by the Epic 12
      # adversarial review (2026-08-07) to `cron` and `billing`: those four
      # are excluded here — plain `wrangler deploy` publishes code AND serves
      # it, so a deploy followed by several `wrangler secret put` calls (the
      # old flow, still used below for the other four workers) means each
      # `secret put` promotes and serves ANOTHER version — several
      # partially-configured releases in a row, live in production, before
      # the last one happens to be complete. `/parse` and `/dossier` sit
      # behind `requireAiEntitlement` and carry PII (medical notes, reference
      # testimony), so that window matters more for these two than for the
      # other four. See the "🔎 Required AI Worker secrets present?" /
      # "🚀 Upload Worker version" / "🚀 Promote uploaded version" steps below
      # for their replacement: `wrangler versions upload --secrets-file`
      # bundles code and every secret into ONE version atomically, and
      # nothing serves traffic until the explicit `versions deploy` promotion
      # that follows it.
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && matrix.worker != 'ai' && matrix.worker != 'parse' && matrix.worker != 'cron' && matrix.worker != 'billing' }}
        name: 🚀 wrangler deploy
        working-directory: workers/${{ matrix.worker }}
        run: npx wrangler deploy

      # The secrets/skip steps below only fire on the missing-secret
      # path (`!env.IS_CLOUDFLARE_CONFIGURED`). A *present but rejected*
      # token — the failure mode from run 30742647288 — falls through to
      # here instead: the step above already failed the job (so it shows
      # red, not silently green), but its wrangler error lives in a
      # collapsed log group a reader has to open. This puts the same
      # fact where the missing-secret case already puts it: the job
      # summary, so "workers didn't deploy" is visible without digging.
      #
      # `ai`/`parse` can also land here via a DIFFERENT failed step now (the
      # required-secrets check below, or the versions upload/promote steps),
      # not only a rejected Cloudflare token — the wording stays generic
      # enough to cover both without misattributing one worker's real cause
      # to the other's.
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && failure() }}
        name: 🚨 Cloudflare Workers deployment FAILED
        run: |
          echo "::error::deployment failed for ${{ matrix.worker }} — see the failed step above for the exact error (commonly an invalid/expired/under-scoped CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, or — for ai/parse — a required secret that was never configured)."
          echo ':rotating_light: **Cloudflare Workers deployment FAILED (`${{ matrix.worker }}`).** See the failed step above for the exact error. This worker was **NOT** deployed. `trigger-frontend` still runs once `deploy-supabase` succeeds — a Cloudflare problem does not block the frontend.' >> "$GITHUB_STEP_SUMMARY"

      # External review Finding 2 (2026-08-06): SUPABASE_URL /
      # SUPABASE_SERVICE_ROLE_KEY / SUPABASE_PUBLISHABLE_KEY (both `ai` and
      # `parse`), plus the Gemini AI Gateway trio (`parse` only), used to be
      # "advisory" — a missing repo secret only printed a `::warning::` and
      # left the job GREEN, so a Worker missing credentials for a route it
      # cannot serve without them still deployed successfully. Every
      # non-health route on both Workers calls `requireAiEntitlement`
      # (workers/shared/aiEntitlementGate.ts), which throws an unhandled
      # `500` without SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/
      # SUPABASE_PUBLISHABLE_KEY; `parse`'s `geminiExtractor()`
      # (workers/parse/resumeExtractor.ts) cannot call Gemini at all without
      # all three Gateway secrets. These are genuinely required, not
      # optional, so a miss now fails the job BEFORE any code is uploaded —
      # this step runs before (and, on failure, blocks) the upload step
      # below. `workers/parse/wrangler.toml` / `workers/ai/wrangler.toml`'s
      # own `[secrets] required = [...]` block is wrangler's OWN independent
      # enforcement of the same requirement, for any deploy of these two
      # Workers that does not go through this workflow at all.
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && (matrix.worker == 'ai' || matrix.worker == 'parse' || matrix.worker == 'cron' || matrix.worker == 'billing') }}
        name: 🔎 Required Worker secrets present? (fails the job, not just a warning)
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_URL:-}" ] || missing+=("SUPABASE_URL")
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ] || missing+=("SUPABASE_PUBLISHABLE_KEY")
          if [ "${{ matrix.worker }}" = "parse" ]; then
            [ -n "${AI_GATEWAY_ACCOUNT_ID:-}" ] || missing+=("AI_GATEWAY_ACCOUNT_ID")
            [ -n "${AI_GATEWAY_ID:-}" ] || missing+=("AI_GATEWAY_ID")
            [ -n "${GOOGLE_AI_STUDIO_API_KEY:-}" ] || missing+=("GOOGLE_AI_STUDIO_API_KEY")
          fi
          # Epic 12 review finding: cron and billing were left on the unsafe
          # path. `cron` arms a schedule the moment it deploys, so publishing
          # it before RESEND_* exists means the sweep runs, finds no
          # credentials, and settles real reminders as delivery failures
          # before anyone can attach them.
          if [ "${{ matrix.worker }}" = "cron" ]; then
            [ -n "${RESEND_API_KEY:-}" ] || missing+=("RESEND_API_KEY")
            [ -n "${RESEND_FROM:-}" ] || missing+=("RESEND_FROM")
            [ -n "${APP_ORIGIN:-}" ] || missing+=("APP_ORIGIN")
          fi
          # `billing` has a webhook endpoint registered against it in Stripe,
          # so a published-but-unconfigured version answers real deliveries
          # with 500s for the length of the configuration window.
          if [ "${{ matrix.worker }}" = "billing" ]; then
            [ -n "${STRIPE_SECRET_KEY:-}" ] || missing+=("STRIPE_SECRET_KEY")
            [ -n "${STRIPE_WEBHOOK_SECRET:-}" ] || missing+=("STRIPE_WEBHOOK_SECRET")
            [ -n "${STRIPE_PRICE_ID_QUARTERLY:-}" ] || missing+=("STRIPE_PRICE_ID_QUARTERLY")
            [ -n "${STRIPE_PRICE_ID_YEARLY:-}" ] || missing+=("STRIPE_PRICE_ID_YEARLY")
            [ -n "${APP_ORIGIN:-}" ] || missing+=("APP_ORIGIN")
          fi

          if [ ${#missing[@]} -eq 0 ]; then
            exit 0
          fi

          echo "::error::${{ matrix.worker }} is missing required secret(s): ${missing[*]}"
          {
            echo ":rotating_light: **\`${{ matrix.worker }}\` was NOT deployed — missing required secret(s): \`${missing[*]}\`.**"
            echo 'This Worker cannot serve its route(s) without them (see this step'"'"'s comment in `.github/workflows/deploy.yml` for why each one is required). Set the missing repo secret(s) and re-run.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # External review Finding 1 (2026-08-06): code and every secret above
      # go up TOGETHER, in one `versions upload` call, as a new Version that
      # is NOT yet serving any traffic — `versions upload` only ever creates
      # a version, it never promotes one (confirmed against `wrangler
      # versions upload --help`, 4.113.0: no flag on this command routes
      # traffic). `--secrets-file` also works on a Worker that does not exist
      # yet (confirmed: wrangler's own error message for a missing secret on
      # a brand-new Worker literally recommends this flag), which
      # `wrangler secret put` alone cannot do — so this covers both the
      # first-ever deploy of `ai`/`parse` and every steady-state redeploy
      # with the same command. `--secrets-file` is additive (per
      # `--help`): a secret not listed here is left untouched, never deleted.
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && (matrix.worker == 'ai' || matrix.worker == 'parse' || matrix.worker == 'cron' || matrix.worker == 'billing') }}
        name: 🚀 Upload Worker version (code + every secret, bundled atomically)
        working-directory: workers/${{ matrix.worker }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          upload_log="$(mktemp)"
          trap 'rm -f "$secrets_file" "$upload_log"' EXIT
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            if [ "${{ matrix.worker }}" = "parse" ]; then
              printf 'AI_GATEWAY_ACCOUNT_ID=%s\n' "$AI_GATEWAY_ACCOUNT_ID"
              printf 'AI_GATEWAY_ID=%s\n' "$AI_GATEWAY_ID"
              printf 'GOOGLE_AI_STUDIO_API_KEY=%s\n' "$GOOGLE_AI_STUDIO_API_KEY"
            fi
            if [ "${{ matrix.worker }}" = "cron" ]; then
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
              printf 'RESEND_FROM=%s\n' "$RESEND_FROM"
              printf 'APP_ORIGIN=%s\n' "$APP_ORIGIN"
              [ -n "${VAPID_PUBLIC_KEY:-}" ] && printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
              [ -n "${VAPID_PRIVATE_KEY:-}" ] && printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
            fi
            if [ "${{ matrix.worker }}" = "billing" ]; then
              printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
              printf 'STRIPE_PRICE_ID_QUARTERLY=%s\n' "$STRIPE_PRICE_ID_QUARTERLY"
              printf 'STRIPE_PRICE_ID_YEARLY=%s\n' "$STRIPE_PRICE_ID_YEARLY"
              printf 'APP_ORIGIN=%s\n' "$APP_ORIGIN"
            fi
          } > "$secrets_file"
          chmod 600 "$secrets_file"

          npx wrangler versions upload \
            --message "CI deploy $GITHUB_SHA" \
            --secrets-file "$secrets_file" \
            | tee "$upload_log"

          version_id=$(sed -n 's/^Worker Version ID: *//p' "$upload_log" | tail -n1)
          if [ -z "$version_id" ]; then
            echo "::error::could not parse a Worker Version ID out of 'wrangler versions upload' output for ${{ matrix.worker }} — nothing was promoted."
            exit 1
          fi
          echo "WRANGLER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      # The explicit promotion `versions upload` above deliberately never
      # does — this is the only step that makes the uploaded version start
      # serving traffic, and it only runs once the version above uploaded
      # successfully WITH every required secret already attached to it.
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && (matrix.worker == 'ai' || matrix.worker == 'parse' || matrix.worker == 'cron' || matrix.worker == 'billing') }}
        name: 🚀 Promote uploaded version to 100% traffic
        working-directory: workers/${{ matrix.worker }}
        run: npx wrangler versions deploy "${WRANGLER_VERSION_ID}@100" --yes --message "CI deploy $GITHUB_SHA"

      # `ai`/`parse` are excluded here — they get SUPABASE_URL /
      # SUPABASE_SERVICE_ROLE_KEY via the atomic `--secrets-file` upload
      # above instead (and fail the job outright if either is missing,
      # rather than silently skipping this push the way the other four
      # workers still do below).
      - if: ${{ env.IS_CLOUDFLARE_CONFIGURED && env.SUPABASE_URL && env.SUPABASE_SERVICE_ROLE_KEY && matrix.worker != 'ai' && matrix.worker != 'parse' && matrix.worker != 'cron' && matrix.worker != 'billing' }}
        name: 🔑 Push base secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)
        working-directory: workers/${{ matrix.worker }}
        run: |
          echo "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - if: ${{ !env.IS_CLOUDFLARE_CONFIGURED }}
        name: Cloudflare deployment skipped
        run: |
          echo ':warning: Cloudflare Workers deployment skipped (${{ matrix.worker }}) — missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret' >> $GITHUB_STEP_SUMMARY

  # The frontend used to deploy on a pipeline entirely OUTSIDE this workflow:
  # Vercel built from its own git integration on the same push that ran
  # `db push`. Two independent pipelines, one trigger, no ordering. On the Epic
  # 3 deploy Vercel finished at 11:59:56 with `db push` still running — new UI
  # live against the old schema — and a *failed* migration still shipped the
  # new frontend.
  #
  # The fix has two halves, and BOTH must be in place or production breaks:
  #
  #   1. `git.deploymentEnabled: { "main": false }` in `vercel.json` stops
  #      Vercel auto-building on push to `main`.
  #   2. This job POSTs a Vercel Deploy Hook once every backend pipeline has
  #      succeeded, which is now the ONLY way production is ever rebuilt.
  #
  # Verified empirically on a throwaway branch before landing (probe branch
  # `ci/vercel-deploy-gate-probe`, since deleted), because guessing wrong here
  # means production silently stops deploying forever:
  #   - a push to a branch with `deploymentEnabled: false` for that branch
  #     created NO deployment; and
  #   - a Deploy Hook aimed at that same branch DID build it anyway.
  # Deploy Hooks bypass `git.deploymentEnabled`. (The documented setting that
  # *does* disable hooks is the deprecated `github.enabled: false` — not this
  # one. Do not add that key.)
  # A push to a DIFFERENT branch while `main: false` was set still produced a
  # preview, so PR previews are unaffected — matching is per-branch-name, and a
  # PR deploys its head branch, never `main`.
  #
  # `needs:` both backend jobs, so the frontend is strictly last-to-START:
  # it does not fire until deploy-workers has finished (success or failure),
  # preserving "workers land before the frontend that may call them, when
  # they land at all". But `needs` alone would also make a *failed*
  # deploy-workers skip this job — and Cloudflare and Vercel are independent
  # providers, so a Cloudflare-side problem has no business blocking a
  # Supabase-and-Vercel deploy. Run 30742647288 (2026-08-02) proved the cost
  # of not separating them: an invalid CLOUDFLARE_API_TOKEN failed every
  # `deploy-workers` leg and this job was skipped outright — production
  # migrations had landed but the frontend never rebuilt, for a reason
  # entirely unrelated to Supabase or Vercel.
  #
  # `if: always() && needs.deploy-supabase.result == 'success'` fixes that:
  # deploy-workers' result is deliberately absent from the condition, so
  # this job runs whenever migrations succeeded, whether the Cloudflare leg
  # succeeded, failed, or (if `share`'s bucket gate above ever produces one)
  # was skipped. A failed migration still blocks it — that ordering
  # guarantee is the one that actually matters, because a frontend built
  # against a schema that failed to migrate is the outage this workflow
  # exists to prevent. A failed Cloudflare deploy is not that: the five
  # workers gated in are inert health-checks the frontend does not depend on
  # to render or to serve auth/CRUD, so shipping the frontend without them
  # is safe, and leaving them undeployed is exactly as loud as it was inside
  # `deploy-workers` (job stays red; see the 🚨 step there) — this job does
  # not paper over it, it just declines to let it cascade.
  #
  # GUARD: if VERCEL_DEPLOY_HOOK_URL is ever absent (secret rotated away,
  # restored-from-backup repo) this job does NOT fail the run — it warns
  # loudly. Failing every deploy over a missing optional secret would be worse
  # than the race being fixed. But note the consequence while it is missing:
  # `vercel.json` still blocks the git build, so production simply does not
  # deploy. The warning says exactly that.
  #
  # Rejected: building the frontend inside CI (`vercel deploy --prebuilt
  # --prod`) costs three more secrets, reconfigures PR previews and loses
  # Vercel's remote build cache; a `vercel.json` `ignoreCommand` that polls the
  # schema would put database credentials inside the Vercel build.
  #
  # HONEST LIMIT, and the reason this is not the whole fix: ordering removes
  # only "new UI against old schema". For the entire duration of the frontend
  # build the NEW schema is live under the OLD frontend, and no ordering closes
  # that half. Only backward-compatible (expand/contract) migrations do — every
  # migration must keep the previous release working for one cycle. That
  # property is required for rollback anyway; the hook just buys the cheap half.
  trigger-frontend:
    name: 🚀 Deploy (Vercel frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-supabase, deploy-workers]
    # See the comment block above: deliberately keys on deploy-supabase's
    # result only. `always()` lifts the default "every `needs:` job must
    # have succeeded" gate so a failed/skipped deploy-workers doesn't
    # skip this job too — deploy-supabase's own result still must be
    # 'success', so a failed migration still blocks the frontend deploy.
    if: ${{ always() && needs.deploy-supabase.result == 'success' }}

    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - if: ${{ env.VERCEL_DEPLOY_HOOK_URL }}
        name: 🚀 Trigger the Vercel production build (backends are live)
        run: |
          curl -sS --fail-with-body -X POST "$VERCEL_DEPLOY_HOOK_URL" \
              -o /tmp/vercel-hook.json \
              || { echo "::error::Vercel deploy hook failed — production was NOT rebuilt and is still on the previous build"; head -c 2000 /tmp/vercel-hook.json >&2; exit 1; }
          echo "🚀 Vercel production build triggered — migrations, edge functions and workers all landed first." >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !env.VERCEL_DEPLOY_HOOK_URL }}
        name: ⚠️ Frontend deploy trigger is not configured
        run: |
          echo '::warning::VERCEL_DEPLOY_HOOK_URL secret is missing — the frontend was NOT deployed.'
          echo ':rotating_light: **The frontend was NOT deployed.** `vercel.json` sets `git.deploymentEnabled.main = false`, so Vercel no longer builds on push; this job is what replaces it, and it needs the `VERCEL_DEPLOY_HOOK_URL` repo secret. Recreate the hook (Vercel → Project → Settings → Git → Deploy Hooks, branch `main`) and store its URL as that secret. Production is still serving the last successful build.' >> $GITHUB_STEP_SUMMARY
