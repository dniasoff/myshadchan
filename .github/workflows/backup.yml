name: 🗄️ Nightly database backup

# There is no PITR and no other backup on the Supabase free tier, so this is
# the only recovery path that will exist. It deliberately does NOT run on
# push: it is scheduled, plus manually dispatchable for a restore drill.
#
# INERT UNTIL CONFIGURED. R2 is not yet enabled on the Cloudflare account and
# the deploy token has no R2 scope, so every step is guarded and the job exits
# 0 with an explanation when secrets are absent. A backup job that fails every
# night is a backup job people mute.
#
# Secrets required before this does anything:
#   SUPABASE_PROJECT_ID     (already used by deploy.yml)
#   SUPABASE_DB_PASSWORD    (already used by deploy.yml)
#   SUPABASE_ACCESS_TOKEN   (already used by deploy.yml)
#   R2_ACCOUNT_ID           NEW - Cloudflare account id
#   R2_ACCESS_KEY_ID        NEW - R2 API token, S3-compatible credentials
#   R2_SECRET_ACCESS_KEY    NEW
#   R2_BUCKET               NEW - e.g. myshadchan-db-backups

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🔐 Check configuration
        id: cfg
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for v in SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_ACCESS_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Backup skipped - not configured yet. Missing:$missing"
            echo "See docs/runbooks/database-restore.md for what to set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.cfg.outputs.ready == 'true'
        name: ⚙️ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - if: steps.cfg.outputs.ready == 'true'
        name: 🏷️ Read pinned Supabase CLI version
        id: supabase_cli_version
        run: |
          version="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).devDependencies.supabase)')"
          test -n "$version" || { echo "::error::package.json does not pin Supabase CLI"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.cfg.outputs.ready == 'true'
        name: ⚙️ Setup supabase
        uses: supabase/setup-cli@v3
        with:
          # Reads the same package.json pin as deploy.yml.
          version: ${{ steps.supabase_cli_version.outputs.version }}

      - if: steps.cfg.outputs.ready == 'true'
        name: 🔗 Link project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - if: steps.cfg.outputs.ready == 'true'
        name: 🗄️ Dump and upload roles, schema and data to private R2
        uses: ./.github/actions/supabase-backup
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}

      - if: steps.cfg.outputs.ready == 'true'
        name: 🧹 Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          endpoint="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/" --endpoint-url "$endpoint" \
            | awk '{print $2}' | tr -d '/' | while read -r prefix; do
              [ -z "$prefix" ] && continue
              day="${prefix%%T*}"
              if [[ "$day" < "$cutoff" ]]; then
                echo "Pruning $prefix (older than $cutoff)"
                aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$prefix/" --recursive --endpoint-url "$endpoint"
              fi
            done
