<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        padding: 10px 0;
      }
      .header h2 {
        margin: 0;
        color: #333333;
      }
      .content {
        padding: 20px;
        line-height: 1.6;
        color: #555555;
      }
      .content p {
        margin: 0 0 10px;
      }
      .code {
        display: block;
        width: fit-content;
        margin: 20px auto;
        padding: 12px 28px;
        text-align: center;
        background-color: #f4f4f4;
        color: #222222 !important;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Your sign-in code</h2>
      </div>
      <div class="content">
        <p>Hello,</p>
        <p>Use this code to sign in to MyShadchan:</p>
        <span class="code">{{ .Token }}</span>
        <p>
          This code expires shortly. If you didn't request it, you can ignore
          this email.
        </p>
        <p>The MyShadchan team</p>
      </div>
    </div>
  </body>
</html>
